# ============================================================
# sync_artifacts.conf.template
#
# 通用产物同步配置模板。
# 复制到项目根目录后改名为 sync_artifacts.conf，再按实际项目修改。
# ============================================================

# 源目录；相对路径以本配置文件所在目录为基准
SOURCE_DIR="../podman"

# 目标列表，格式: user@host:port:remote_dir
# 支持多个目标，每行一个
REMOTE_DESTINATIONS=(
  "apyyc@192.168.18.48:22:/home/apyyc/src"
)

# 带宽限制，单位 KB/s；0 表示不限速
BWLIMIT_KBPS=0

# 日志目录；留空表示 ./logs
LOG_DIR=""

# SSH 私钥文件路径；留空表示使用默认 ssh 配置
SSH_KEY_FILE=""

# 额外 ssh 参数
SSH_EXTRA_OPTS=()

# 额外 rsync 参数
RSYNC_EXTRA_ARGS=()

# 是否删除远端多余文件；首次同步建议保持 false
DELETE_REMOTE=false
