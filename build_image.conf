# ============================================================
# artifactdepot build_image.conf
# ============================================================

PROJECT_ID="artifactdepot"
PROJECT_TITLE="ArtifactDepot"
PROJECT_ROOT="."

REGISTRY="localhost"
DEFAULT_TAG="0.8.0"

TOOL_PREFERENCE=(podman docker)

BUILD_NETWORK="host"

# ---------- 构建代理 ----------
# keep  = 继承当前 shell 的 HTTP(S)_PROXY 环境变量
# strip = 摘掉环境里的代理，构建全程直连
# set   = 用下面 PROXY_URL 显式注入（当前使用）
PROXY_MODE="set"
PROXY_VARS=(HTTP_PROXY HTTPS_PROXY http_proxy https_proxy)

# 代理地址: http://主机:端口/   （当前代理免认证，不需要账号密码）
# 若以后加回账号密码，写成 http://用户名:密码@主机:端口/；注意本文件会进 git，
# 账密会被提交，可用 git update-index --skip-worktree build_image.conf 规避
PROXY_URL="http://192.168.18.46:7893/"

# 不走代理的地址（逗号分隔），仅 set 模式生效:
# 本机 + Dockerfile 里用到的国内源（本来直连就快，绕代理反而慢）
PROXY_NO_PROXY="localhost,127.0.0.1,::1,mirrors.tuna.tsinghua.edu.cn,pypi.tuna.tsinghua.edu.cn"

PODMAN_HTTP_PROXY_FALSE=false
PODMAN_FORMAT_DOCKER=true

BUILD_NO_CACHE_DEFAULT=false
BUILD_PULL_POLICY=""

SAVE_DEFAULT=true
SAVE_DIR="../podman"
SAVE_NAME_PATTERN='${IMAGE_NAME}-${TAG}.tar'
SAVE_OVERWRITE=true

VALIDATE_DOCKERFILE=true
VALIDATE_REQUIRED_PATHS=true
CONTEXT_MISSING_POLICY="error"

LOG_LEVEL="normal"
SHOW_COMMANDS=false

IMAGE_IDS=(app)

declare -A IMAGE_LABEL=(
  [app]="app"
)

declare -A IMAGE_DOCKERFILE=(
  [app]="Dockerfile"
)

declare -A IMAGE_CONTEXT=(
  [app]="."
)

declare -A IMAGE_NAME=(
  [app]="artifactdepot"
)

declare -A IMAGE_TAG_MODE=(
  [app]="dynamic"
)

declare -A IMAGE_TAG_VALUE=(
  [app]=""
)

declare -A IMAGE_REQUIRED_PATHS=(
  [app]="src docker"
)

declare -A IMAGE_OPTIONAL_PATHS=(
  [app]=""
)

declare -A IMAGE_BUILD_ARGS=(
  [app]=""
)

declare -A IMAGE_BUILD_TARGET=(
  [app]=""
)

declare -A IMAGE_PLATFORM=(
  [app]=""
)

declare -A IMAGE_ENABLED_BY_DEFAULT=(
  [app]=true
)

declare -A IMAGE_SAVE_ENABLED=(
  [app]=true
)

declare -A IMAGE_SAVE_DIR=(
  [app]=""
)

declare -A IMAGE_SAVE_NAME=(
  [app]='${IMAGE_NAME}-${TAG}.tar'
)

declare -A IMAGE_PRE_BUILD_CMD=(
  [app]=""
)

declare -A IMAGE_POST_BUILD_CMD=(
  [app]=""
)

declare -A IMAGE_PROXY_MODE=(
  [app]=""
)

declare -A IMAGE_PODMAN_HTTP_PROXY_FALSE=(
  [app]=""
)

declare -A IMAGE_PODMAN_FORMAT_DOCKER=(
  [app]=""
)
